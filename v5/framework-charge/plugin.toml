id = "pwilcke/framework-charge"
name = "Framework Charge"
version = "0.2.0"
plugin_api = 32
author = "pwilcke"
license = "MIT"
description = "Choose the battery charge limit on a Framework Laptop 13 Pro or a ThinkPad."
icon = "battery-eco"
tags = ["hardware", "system", "panel"]
dependencies = ["pkexec", "python3"]

[[panel]]
id = "panel"
entry = "panel.luau"
# The labels span 254 px (the open end, the bar, and half of the "100" label), plus
# 1 px of padding and Noctalia's 14 px on each side.
width = 284
height = 128
placement = "attached"
open_near_click = true
capture_keys = ["Left", "Right", "Home", "End", "Page_Up", "Page_Down"]
